# Billboard API settings. Read at game or server start.

# Lua Boxes run Lua programs on the server. Switch them off, or allow only operators
# to give them files and to restart or stop them (good for public servers).
boxes_enabled=true
boxes_ops_only=false

# Lua time per box and tick in milliseconds; then the program pauses until the next tick.
box_ms_per_tick=2
# A program that runs this many seconds without sleep() is stopped.
box_max_busy_seconds=5
# A program that uses its whole time for this many seconds, with no sleep() longer than one tick, is stopped as too busy.
box_too_busy_seconds=30

# Largest .lua file, number of files besides main.lua, largest other file (up to 16384 KB).
box_max_lua_kb=64
box_max_files=8
box_max_file_kb=2048
# File types a box may hold besides main.lua, separated by commas.
box_file_types=png,jpg,jpeg,gif,bmp,txt,json,csv,lua

# A network is every Lua Box and pipe connected to a box, and the machines touching them.
# Over a limit the whole network stops working, with an error that says why.
network_max_pipes=512
network_max_clients=64
network_max_boxes=8
# false (the default): any box drives any machine it reaches. true: a box drives only machines
# placed by its own owner (machines from before get the owner of the first box that reaches them).
network_owner_check=true

# Only for the game, not the server: looking at a machine of a network shows its name under the
# crosshair. With Jade installed, Jade's box shows the name instead.
name_hint=true
