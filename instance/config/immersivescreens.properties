# Immersive Screens settings. Also changed in game: Options > Screen Theme, the mod list, or /immersivescreens.
# Delete this file to go back to the defaults.

# theme = halloween | hologram | winter | space | arcade | off
theme=halloween
riseFromBlock=true
breakOnClose=true
decorations=true
reduceMotion=false
themeMusic=true
# winterMusic = auto (Christmas tune in December) | christmas | winter
winterMusic=auto

# What to theme. false = left exactly as the game, a resource pack or another mod draws it
# (no repaint, no animation, no decoration). A missing key counts as true.
#   themeInventory    player inventory and creative inventory
#   themeContainers   chests, barrels, ender chests, shulker boxes, hoppers, dispensers, droppers, horse/llama
#   themeWorkstations crafting table, furnaces, anvil, enchanting table, smithing, villagers and every other
#                     screen of the game with slots
#   themeOtherMods    screens and container textures of other mods
#   themeMenus        title screen, pause menu, options and other menus, and the game's buttons, sliders and
#                     text boxes everywhere
#   themeLoading      resource-loading screen and world-loading bar
#   themeHotbar       the hotbar (slots, selected slot, offhand slot, glow)
#   themeHudIcons     plain hearts, plain hunger shanks and the experience bar
#   themeTooltips     item and button tooltips
# The recipe book, the highlight of the slot under the pointer and the empty-slot icons are drawn in several
# kinds of screen at once: they take the theme only while all of those screens are on.
themeInventory=true
themeContainers=true
themeWorkstations=true
themeOtherMods=true
themeMenus=true
themeLoading=true
themeHotbar=true
themeHudIcons=true
themeTooltips=true

# Your own colours, per theme, as #RRGGBB (empty = the theme's own colour; an invalid value is ignored).
#   panel   panels, slots, button fill, hotbar, menu backgrounds
#   frame   frames, borders, button outline, selected slot, highlights
#   accent  the theme's second colour (experience bar, hunger, some hovers and glows)
#   text    container labels and button text
# Every colour of the theme close to a role moves with it, keeping its light and shade. Decorations
# (bats, snowmen, planets...) keep their own colours.
# Example: colors.halloween.panel=#2A1240
colors.halloween.panel=#FF8800
colors.halloween.frame=#3A1A48
colors.halloween.accent=
colors.halloween.text=#FFAA80
colors.hologram.panel=
colors.hologram.frame=
colors.hologram.accent=
colors.hologram.text=
colors.winter.panel=
colors.winter.frame=
colors.winter.accent=
colors.winter.text=
colors.space.panel=
colors.space.frame=
colors.space.accent=
colors.space.text=
colors.arcade.panel=
colors.arcade.frame=
colors.arcade.accent=
colors.arcade.text=
