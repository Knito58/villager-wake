#Optional spoken replies. No extra TTS language setting: speech uses the same reply text/language as the AI prompt (player chat + game locale). Requires Simple Voice Chat.
[voice]
	#Linear gain for synthesized speech, 0.0-1.0. 0 mutes voice and keeps text.
	volume = 1.0
	#Hearing distance in blocks. 0 uses proximity.responseRadius.
	range = 0.0
	#If true, still show chat/action-bar text when voice plays. If voice cannot play, text is always shown.
	fallbackToText = true
	#Attempt spoken playback when Simple Voice Chat is installed. Harmless no-op without it.
	enabled = true

[persona]
	allowPlayersEditPersona = false

[proximity]
	hearingRadius = 12.0
	responseRadius = 16.0
	activationMode = "SMART"
	chatPrefix = "!"
	enabled = true
	requirePrefix = false
	#Villagers stay quiet when a message names another online player (and not the villager).
	ignorePlayerToPlayerChat = true

[display]
	mode = "CHAT"
	#Show replies in a speech bubble above the villager (a vanilla text display; no client mod needed).
	speechBubbles = true
	cancelGlobalChatWhenTalking = false

[ai]
	#CUSTOM only: OpenAI-compatible base URL or full /chat/completions endpoint. Never put keys in the URL.
	apiBaseUrl = "https://api.deepseek.com/chat/completions"
	#AUTO, max_tokens, max_completion_tokens or NONE, according to your model/server API.
	tokenLimitParameter = "AUTO"
	globalRequestsPerMinute = 30
	maxReplyChars = 180
	#Selected provider's API key. SMARTVILLAGERS_API_KEY, provider-specific env and secrets.toml override this. Never share your key.
	apiKey = ""
	maxConcurrent = 3
	thinkingDelayMinTicks = 20
	#CUSTOM: AUTO appends /chat/completions unless already present. FULL preserves a complete URL, including legacy custom routes.
	endpointMode = "AUTO"
	playerCooldownMs = 3000
	thinkingDelayMaxTicks = 60
	#DEEPSEEK, NANOGPT, NANOGPT_SUBSCRIPTION, OPENAI, OPENROUTER, OLLAMA, LMSTUDIO or CUSTOM. Presets select their own endpoint; apiBaseUrl is used only for CUSTOM.
	provider = "DEEPSEEK"
	#Completion token budget (including reasoning); replies are separately clipped to maxReplyChars.
	maxTokens = 2048
	#Exact model ID from the selected provider's model list. NanoGPT subscription requires an included model.
	model = "deepseek-flash"

[privacy]
	requirePlayerOptIn = true

#Village requests: ask a villager for work ("any work for me?"), accept, finish it, get paid.
[requests]
	#Minutes of game time before the same villager offers that player another request (20 = one Minecraft day).
	cooldownMinutes = 10
	#Minor positive gossip added to the villager for a finished request (vanilla reputation: better prices, shared with neighbours). 0 disables.
	reputationReward = 10
	#Villagers offer requests when asked for work.
	enabled = true
	#How many accepted requests a player can have open at once.
	maxActive = 3
