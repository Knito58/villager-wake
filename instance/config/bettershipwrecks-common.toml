#How often each ship class is picked (relative weights, 0 disables a class).
[ships]
	#Small one-masted sloop with a fore-and-aft sail and a stern cabin.
	# Default: 20
	# Range: 0 ~ 1000
	sloop = 20
	#Two-masted brig with forecastle, quarterdeck and deck guns.
	# Default: 30
	# Range: 0 ~ 1000
	brig = 30
	#Deep-bellied merchantman with a cargo hold and a tall stern.
	# Default: 20
	# Range: 0 ~ 1000
	merchant = 20
	#Three-masted galleon with a gun deck and a stern gallery (deep water only).
	# Default: 16
	# Range: 0 ~ 1000
	galleon = 16
	#Viking longship with shields and a striped sail (mostly cold waters).
	# Default: 15
	# Range: 0 ~ 1000
	longship = 15

#How often each kind of wreck is picked for sunken ships (beached ones are always upright or listing).
[wrecks]
	#Settled upright on the sea floor.
	# Default: 30
	# Range: 0 ~ 1000
	upright = 30
	#Heeled over to one side.
	# Default: 30
	# Range: 0 ~ 1000
	listing = 30
	#Snapped in two, both halves pitched up.
	# Default: 18
	# Range: 0 ~ 1000
	broken = 18
	#Lying on its side.
	# Default: 12
	# Range: 0 ~ 1000
	capsized = 12
	#Keel up.
	# Default: 10
	# Range: 0 ~ 1000
	upsideDown = 10

[generation]
	#How damaged wrecks are: 0 = nearly intact, 1 = torn apart.
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	decay = 0.4
	#Multiplier for the drowned crew inside sunken wrecks (0 = none).
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	crew = 1.0
	#Chance that a sloop, brig or galleon is a black-sailed pirate ship.
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	pirateChance = 0.15

#Options added in Better Shipwrecks 1.1.
[extras]
	#Chance that a wreck gets one of the rare looks (cherry hulls, ghost ships, coloured sails, royal flagships...). 0 = never.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	rareLooks = 0.2
	#Multiplier for the cargo and guns spilled on the seabed around a wreck (0 = none).
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	spilledCargo = 1.0
	#On Minecraft versions without mangrove, cherry or pale oak wood (or chains, lanterns and lightning rods), use
	#those blocks from an installed backport mod instead of the older vanilla stand-in.
	# Default: true
	backportedBlocks = true
