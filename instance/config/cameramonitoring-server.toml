#Hard limits on how many cameras may exist.
[limits]
	#Maximum number of registered cameras in the whole save. -1 disables the limit.
	#Default: 2048
	#Range: -1 ~ 65536
	maxCamerasPerWorld = 2048
	#Maximum number of cameras a single player may own. -1 disables the limit.
	#Default: 128
	#Range: -1 ~ 65536
	maxCamerasPerPlayer = 128
	#Maximum number of modules that may be installed in one camera.
	#Default: 3
	#Range: 1 ~ 9
	maxModulesPerCamera = 3

#Rules applied when a player looks through a camera.
[viewing]
	#Maximum distance in blocks between the player and a camera they want to view.
	#Checked on the server for every access request. -1 disables the check.
	#Default: 256
	#Range: -1 ~ 16384
	maxViewDistance = 256
	#Allow viewing cameras and body cameras that are in another dimension than the viewer.
	#While watching, the viewer is moved into that dimension as a spectator and brought back afterwards.
	#Default: true
	crossDimensionViewing = true
	#A camera view session is force-closed after this many seconds without client input.
	#Protects against clients that stop responding while holding a session open.
	#Default: 600
	#Range: 30 ~ 7200
	viewSessionTimeoutSeconds = 600
	#If true, a Camera Monitoring Station only works while it receives redstone power.
	#Default: false
	requireStationPowered = false

#Entity detection performance and limits.
[detection]
	#Upper bound for the detection radius of any Entity Detector Module.
	#Default: 32
	#Range: 1 ~ 128
	maxDetectionRadius = 32
	#Detection radius a freshly installed Entity Detector Module starts with.
	#Default: 12
	#Range: 1 ~ 128
	defaultDetectionRadius = 12
	#Minimum number of ticks between two detection scans of the same camera.
	#Lower values cost more CPU. 20 ticks equals one second.
	#Default: 10
	#Range: 1 ~ 200
	minDetectionIntervalTicks = 10
	#Maximum number of entities reported by one scan of one camera.
	#Default: 12
	#Range: 1 ~ 128
	detectionsPerCameraPerScan = 12
	#How often a camera with nothing to do runs its housekeeping tick.
	#Default: 40
	#Range: 5 ~ 200
	idleCameraTickInterval = 40
	#How far from a camera, in blocks, a player can be and still make an
	#auto-switching monitor screen change over to that camera.
	#Default: 32
	#Range: 4 ~ 128
	screenAutoSwitchRange = 32

#Alarm behaviour.
[alarms]
	#Master switch for the alarm system.
	#Default: true
	alarmsEnabled = true
	#Minimum number of ticks between two alarms raised by the same camera.
	#Default: 100
	#Range: 20 ~ 12000
	alarmCooldownTicks = 100
	#Hard cap on alarms one camera may raise per minute, whatever its own settings say.
	#Default: 12
	#Range: 1 ~ 240
	maxAlarmsPerMinutePerCamera = 12
	#If true, a raised alarm also plays an audible siren at the camera itself.
	#Default: true
	alarmPlaysWorldSound = true

#Security event log.
[logging]
	#Number of log entries kept per camera before the oldest ones are dropped.
	#Default: 64
	#Range: 0 ~ 1024
	maxLogEntriesPerCamera = 64
	#Number of entries kept in the world-wide security log.
	#Default: 512
	#Range: 0 ~ 8192
	maxGlobalLogEntries = 512
	#Log entries older than this many minutes of in-game time are discarded. -1 keeps them forever.
	#Default: 1440
	#Range: -1 ~ 525600
	logRetentionMinutes = 1440

#Passwords and access control.
[security]
	#How long a successful password unlock stays valid for a player.
	#Default: 300
	#Range: 10 ~ 86400
	authSessionTimeoutSeconds = 300
	#Failed password attempts allowed before a player is locked out of that device.
	#Default: 5
	#Range: 1 ~ 100
	maxPasswordAttempts = 5
	#Duration of the lockout after too many failed password attempts.
	#Default: 60
	#Range: 5 ~ 86400
	passwordLockoutSeconds = 60
	#If true, server operators (permission level 2 or higher) may bypass camera passwords.
	#Default: true
	opsBypassPasswords = true
	#Minimum length accepted when a player sets a password.
	#Default: 3
	#Range: 1 ~ 64
	minPasswordLength = 3

#Client and server traffic shaping.
[networking]
	#How often the server broadcasts a camera orientation to nearby clients.
	#Default: 4
	#Range: 1 ~ 40
	orientationUpdateIntervalTicks = 4
	#Rate limit for camera control packets accepted from a single player.
	#Default: 60
	#Range: 5 ~ 600
	maxPacketsPerSecondPerPlayer = 60
