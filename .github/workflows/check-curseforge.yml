name: Check mods on CurseForge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: download the pack's jars from Modrinth
        run: python3 tools/fetch_jars.py prism-index work/mods

      - name: match jars against CurseForge by fingerprint
        working-directory: work
        run: |
          packwiz init --name check --author check --version 0 \
            --mc-version 26.1.2 --modloader fabric --fabric-version 0.19.3 -r
          packwiz curseforge detect

      - name: write report
        run: python3 tools/report.py prism-index work/mods reports/curseforge-check.md

      - name: commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/curseforge-check.md
          git commit -m "CurseForge check report" || echo "no change"
          git push
