name: Make CurseForge pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: make pack
        run: tools/make_pack.sh

      - name: commit pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack reports/make-pack.md dist
          git commit -m "Make CurseForge pack from the Prism mod list" || echo "no change"
          git push
