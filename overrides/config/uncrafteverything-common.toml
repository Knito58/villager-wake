# UncraftEverything Configuration

[Experience]
	# The type of experience to be used.
	experienceType = "LEVEL"
	# The default amount of experience point/level required to uncraft an item. More detailed exp can be configured in uncrafteverything-exp.json
	experiences = 0

[Restrictions]
	# The type of restriction to be used.
	restrictionType = "BLACKLIST"
	# A list of items that can/cannot be uncrafted depending on type of restriction.
	#Invalid input will cause config reset at runtime.
	#Format: modid:item_name / modid:* / modid:*_glass / modid:black_* / modid:red_*_glass / modid:red_*_glass* / #modid:item_tag_name
	#Press F3 + h in game and hover item to check their modid:name
	restrictions = []
	# Restrict recipe that use ItemTags ingredient from uncrafting.
	restrictAmbiguouslyCraftedItems = false

[Enchanted]
	# Allow uncrafting of enchanted items. [true/false]
	allowEnchantedItems = true
	# Output Enchanted Book for enchanted item. [true/false]
	outputEnchantedBook = true

[UnSmithing]
	# Allow uncrafting of items that obtained from smithing (Trimmed Armor/Netherite Armor). [true/false]
	allowUnSmithing = true

[Damaged]
	# Allow uncrafting of damaged items. [true/false]
	allowDamaged = true
	# Allow uncrafting of damaged items that have no repair ingredient (e.g. bows, crossbows, shears, fishing rods). Returns full ingredients regardless of durability. Exploitable. [true/false]
	allowDamagedNonRepairable = false
	# Minimum durability for non repairable damaged item in percentage. (0.0 - 1.0)
	minimumDurability = 0.8

[ModdedIngredients]
	# Prevents vanilla items (e.g., iron axe) from being uncrafted using modded recipes.
	#This helps avoid potential duplication or unintended outputs caused by modded ingredients. [true/false]
	preventModdedIngredientsFromVanillaItems = true
	# A list of modid that would be excluded when uncrafting, to prevent too much recipes and causing performance issues.
	#Format: modid
	restrictedModIngredients = ["productivetrees", "chipped"]

[RecipeSelectionOrder]
	# Recipe selection should prioritize recipe with more vanilla ingredients. [true/false]
	prioritizeVanillaIngredientRecipe = true

[FTBQuestProgression]
	# Enable progression based uncrafting recipe search (Only available when FTB Quests is added to the mod pack)
	enableProgression = false
	# When FTB Quests is added and progression enabled, only item defined in progression config able to uncraft, all other item will be disabled.
	onlyAllowDefinedProgression = false
